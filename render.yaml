services:
  - type: web
    name: anjurxbot
    runtime: python
    buildCommand: (which npm >/dev/null 2>&1 && npm install && npm run build || true) && pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: BOT_TOKEN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SUPER_ADMIN_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: TIMEZONE
        value: Asia/Tashkent
