services:
  - type: worker            # Background Worker — no HTTP port required
    name: anjurxbot
    runtime: python
    region: frankfurt        # or oregon / ohio — choose nearest to your users
    plan: free               # upgrade to starter/standard for production SLAs

    # Render reads the repo root; point to your requirements file
    buildCommand: pip install -r requirements.txt

    # Start command
    startCommand: python main.py

    # Environment variables are managed in the Render dashboard (not here).
    # Do NOT paste secret values in this file.
    #
    # Required variables to set in the Render dashboard:
    #   BOT_TOKEN
    #   ADMIN_IDS
    #   FIREBASE_PROJECT_ID
    #   FIREBASE_PRIVATE_KEY_ID
    #   FIREBASE_PRIVATE_KEY
    #   FIREBASE_CLIENT_EMAIL
    #   FIREBASE_CLIENT_ID
    #   FIREBASE_CLIENT_X509_CERT_URL
    #   (optional) FIREBASE_AUTH_URI
    #   (optional) FIREBASE_TOKEN_URI
    #   (optional) FIREBASE_AUTH_PROVIDER_X509_CERT_URL
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: web
    name: anjurxbot-admin
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.web_admin
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: WEB_ADMIN_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      - key: FIREBASE_CLIENT_X509_CERT_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: TIMEZONE
        value: Asia/Tashkent
